<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Ingresar · Salas de cultivo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="login">
    <h1>Salas <span>de cultivo</span></h1>
    <form id="form-login" class="tarjeta">
      <label>Clave
        <input type="password" name="clave" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" id="error"></p>
      <button>Ingresar</button>
    </form>
  </main>
  <script>
    // Manda la clave al servidor; si es correcta, el servidor deja una cookie
    // de sesión (30 días) y volvemos a la página principal.
    const form = document.getElementById('form-login');
    form.onsubmit = async ev => {
      ev.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave: form.clave.value }),
      });
      if (res.ok) { location.href = '/'; return; }
      const r = await res.json().catch(() => ({}));
      document.getElementById('error').textContent = r.detail || 'No se pudo ingresar';
      form.clave.select();
    };
  </script>
</body>
</html>
