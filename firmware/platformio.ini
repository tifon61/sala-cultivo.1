; Firmware de los módulos de sala.
;   Compilar y subir:   cd firmware && pio run -e esp32dev -t upload && pio device monitor
;   Pruebas en la PC:   cd firmware && pio test -e native
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0          ; = Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    sensirion/Sensirion I2C SCD4x@1.0.0

; El motor de reglas no depende de Arduino: se prueba en la computadora.
[env:native]
platform = native
build_flags = -std=gnu++17
build_src_filter = +<reglas.cpp> +<config_sala.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@7.2.1
