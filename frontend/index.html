<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Salas de cultivo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="estilos.css">
  <!-- Chart.js 4.4.1 copiado al repo: la página no depende de internet ni de un CDN. -->
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Salas <span>de cultivo</span></h1>
    <div class="cabecera-derecha">
      <div id="conexion" class="conexion">
        <span class="punto"></span><span id="conexion-texto">conectando…</span>
      </div>
      <button id="salir" class="salir" title="Cerrar sesión">Salir</button>
    </div>
  </header>

  <main>
    <!-- Esquema: un rectángulo por sala, pegados como en un plano. -->
    <section>
      <div id="plano" class="plano"></div>
    </section>

    <nav id="pestanas" class="pestanas"></nav>

    <section>
      <div id="modulo" class="modulo"></div>
      <h2>Equipos</h2>
      <div id="reles" class="lista-reles"></div>
    </section>

    <section>
      <div class="titulo-con-control">
        <h2>Histórico</h2>
        <div class="controles-historico">
          <label>Período
            <select id="periodo">
              <option value="6">Últimas 6 h</option>
              <option value="24" selected>Últimas 24 h</option>
              <option value="72">Últimos 3 días</option>
              <option value="168">Últimos 7 días</option>
              <option value="720">Últimos 30 días</option>
              <option value="rango">Elegir fechas…</option>
            </select>
          </label>
          <label>DPV en
            <select id="unidad-dpv">
              <option value="kPa">kPa</option>
              <option value="hPa">hPa</option>
            </select>
          </label>
        </div>
      </div>
      <div id="rango" class="rango" hidden>
        <label>Desde<input type="date" id="desde"></label>
        <label>Hasta<input type="date" id="hasta"></label>
      </div>
      <p class="error" id="error-periodo"></p>
      <div id="graficos"></div>
    </section>

    <section>
      <h2>Bitácora</h2>
      <form id="form-bitacora" class="form-bitacora tarjeta">
        <label>Qué pasó
          <select name="tipo">
            <option value="etapa">Cambio de etapa</option>
            <option value="nota">Nota</option>
            <option value="riego_nutrientes">Riego con nutrientes</option>
            <option value="poda">Poda / defoliación</option>
            <option value="trasplante">Trasplante</option>
            <option value="plaga">Plaga / problema</option>
            <option value="cosecha">Cosecha</option>
            <option value="mantenimiento">Mantenimiento</option>
          </select>
        </label>
        <label class="campo-etapa">Nueva etapa
          <select name="etapa">
            <option value="germinacion">Germinación</option>
            <option value="plantines">Plantines / esquejes</option>
            <option value="vegetativo">Vegetativo</option>
            <option value="floracion" selected>Floración</option>
            <option value="secado">Secado</option>
            <option value="curado">Curado</option>
            <option value="vacia">Sala vacía</option>
          </select>
        </label>
        <label>Día (vacío = ahora)<input type="date" name="fecha"></label>
        <label>Hora<input type="text" name="hora" inputmode="numeric" maxlength="5" placeholder="HH:MM"
               pattern="([01][0-9]|2[0-3]):[0-5][0-9]" title="Hora en formato 24 h, por ejemplo 14:30"></label>
        <label class="ancho">Detalle<textarea name="texto" rows="2" placeholder="EC 1.8, pH 6.2, 2 L por maceta…"></textarea></label>
        <p class="error ancho" id="error-bitacora"></p>
        <button class="ancho">Agregar a la bitácora</button>
      </form>
      <ul id="bitacora" class="bitacora"></ul>
    </section>

    <section>
      <h2>Últimos cambios de equipos</h2>
      <ul id="eventos" class="eventos"></ul>
    </section>
  </main>

  <template id="tpl-rele">
    <article class="rele tarjeta">
      <div class="rele-cabecera">
        <div>
          <h3 class="rele-nombre"></h3>
          <p class="rele-motivo"></p>
        </div>
        <span class="pastilla"></span>
      </div>
      <div class="rele-controles">
        <button data-accion="auto">Auto</button>
        <button data-accion="on">Encender</button>
        <button data-accion="off">Apagar</button>
        <select class="duracion" aria-label="Duración del modo manual">
          <option value="">sin límite</option>
          <option value="5">5 min</option>
          <option value="15">15 min</option>
          <option value="60">1 h</option>
          <option value="240">4 h</option>
        </select>
      </div>
      <details class="rele-regla">
        <summary>Regla automática</summary>
        <form class="form-regla"></form>
      </details>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
