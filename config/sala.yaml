# Relés de la sala y su regla automática INICIAL.
#
# Este archivo solo se lee cuando un relé todavía no existe en la base de datos.
# Después, las reglas se cambian desde la web (y quedan guardadas en Postgres).
# Si agregás un relé nuevo acá, aparece al reiniciar el backend.
#
# El "id" de cada relé (luz, extractor, ...) tiene que coincidir con el del
# firmware (firmware/include/config.h), porque viaja en el tópico MQTT.
#
# Tipos de regla:
#   horario: encendido entre "encender" y "apagar" (puede cruzar medianoche).
#   umbral:  mira una variable medida. encender_si "mayor" -> se prende cuando
#            valor > umbral y se apaga cuando baja de umbral - histeresis.
#            "menor" es al revés. La histéresis evita que el relé "tiritee".
#   ciclo:   a partir de "inicio", cada "cada_min" minutos se prende
#            "duracion_min" minutos. "repeticiones" limita cuántas veces por día.

reles:
  luz:
    nombre: Luz
    regla:
      tipo: horario
      encender: "06:00"
      apagar: "00:00"        # 18 h de luz / 6 de oscuridad (vegetativo)

  extractor:
    nombre: Extractor
    regla:
      tipo: umbral
      variable: temperatura
      encender_si: mayor
      valor: 28
      histeresis: 1.5

  humidificador:
    nombre: Humidificador
    regla:
      tipo: umbral
      variable: humedad
      encender_si: menor
      valor: 55
      histeresis: 5

  riego:
    nombre: Riego
    regla:
      tipo: ciclo
      inicio: "09:00"
      cada_min: 480          # cada 8 h...
      duracion_min: 2        # ...2 minutos de bomba
      repeticiones: 2        # 09:00 y 17:00
