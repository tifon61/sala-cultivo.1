listener 1883

# Nadie se conecta sin usuario y contraseña.
allow_anonymous false
password_file /mosquitto/passwd
# Cada usuario solo puede usar sus tópicos.
acl_file /mosquitto/acl

# Guarda en disco los mensajes "retained" (p. ej. el último estado de cada relé).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
