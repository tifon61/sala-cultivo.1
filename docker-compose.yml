# Salas de cultivo: broker MQTT + base de datos + backend (API y web).
#
# Es un proyecto de Compose independiente del sistema meteorológico: tiene su
# propia red interna, sus propios volúmenes y no usa los puertos 8080/8081/5432.
#
#   ESP32 (otra casa) ──internet──► Tailscale Funnel :8443 (TLS) ──► mosquitto :1883
#                                                                      ▲
#   celular / notebook ──Tailscale──► backend :8090 ───────────────────┘
#                                        └──► postgres (solo red interna)
name: sala-cultivo

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    # El entrypoint arma el archivo de contraseñas a partir del .env en cada arranque.
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    environment:
      MQTT_CLAVE_BACKEND: ${MQTT_CLAVE_BACKEND}
      MQTT_SALAS: ${MQTT_SALAS}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/acl.original:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mosquitto-datos:/mosquitto/data
    ports:
      # Solo en localhost: desde internet se entra por Tailscale Funnel, que
      # agrega el cifrado TLS (ver README). MQTT_BIND=0.0.0.0 lo abre a la red local.
      - "${MQTT_BIND:-127.0.0.1}:${MQTT_PUERTO_HOST:-1883}:1883"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cultivo
      POSTGRES_USER: cultivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db-datos:/var/lib/postgresql/data
    # Sin "ports": Postgres solo es visible dentro de la red de este Compose,
    # así que no choca con el 5432 del sistema meteorológico.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultivo -d cultivo"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cultivo:${POSTGRES_PASSWORD}@db:5432/cultivo
      MQTT_HOST: mosquitto
      MQTT_PUERTO: 1883
      MQTT_USUARIO: backend
      MQTT_CLAVE: ${MQTT_CLAVE_BACKEND}
      WEB_CLAVE: ${WEB_CLAVE:-}
      TZ: ${TZ}
    volumes:
      # Valores iniciales de salas, relés y reglas (solo se usan la primera vez).
      - ./config/salas.yaml:/app/config/salas.yaml:ro
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PUERTO:-8090}:8000"

volumes:
  mosquitto-datos:
  db-datos:
